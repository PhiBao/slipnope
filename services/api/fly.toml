app = "slipnope-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
  [http_service.grace_period]
    seconds = 30

[http_service.limits]
  concurrency = 50

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
