<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" font-family="monospace">
  <rect width="1240" height="660" fill="#0a0906"/>
  <text x="40" y="48" fill="#f5ecd7" font-size="22" font-weight="bold">ROBINHOOK — HOW A GUARDED SWAP WORKS</text>
  <text x="40" y="72" fill="#a29372" font-size="12">Uniswap v4 hook enforcement on Robinhood Chain (4663) · one transaction, no app in the middle</text>

  <!-- actors -->
  <g font-size="13" text-anchor="middle">
    <rect x="40" y="110" width="150" height="54" fill="#141109" stroke="#ffb300" stroke-width="2"/>
    <text x="115" y="133" fill="#f5ecd7" font-weight="bold">TRADER</text>
    <text x="115" y="152" fill="#a29372" font-size="11">wallet signs</text>

    <rect x="250" y="110" width="190" height="54" fill="#141109" stroke="#2e2716" stroke-width="2"/>
    <text x="345" y="133" fill="#f5ecd7" font-weight="bold">GUARDED SWAP ROUTER</text>
    <text x="345" y="152" fill="#a29372" font-size="11">hookData = trader</text>

    <rect x="500" y="110" width="190" height="54" fill="#141109" stroke="#2e2716" stroke-width="2"/>
    <text x="595" y="133" fill="#f5ecd7" font-weight="bold">V4 POOLMANAGER</text>
    <text x="595" y="152" fill="#a29372" font-size="11">NVDA / USDG pool</text>

    <rect x="750" y="110" width="210" height="54" fill="#1c170c" stroke="#ffb300" stroke-width="2"/>
    <text x="855" y="133" fill="#ffb300" font-weight="bold">ROBINHOOK (beforeSwap)</text>
    <text x="855" y="152" fill="#a29372" font-size="11">the guard lives here</text>

    <rect x="1020" y="110" width="180" height="54" fill="#141109" stroke="#2e2716" stroke-width="2"/>
    <text x="1110" y="133" fill="#f5ecd7" font-weight="bold">CHAINLINK FEED</text>
    <text x="1110" y="152" fill="#a29372" font-size="11">NVDA fair price</text>
  </g>

  <!-- flow arrows -->
  <g stroke="#a29372" stroke-width="1.5" font-size="11.5">
    <line x1="190" y1="137" x2="246" y2="137" marker-end="url(#arr)"/>
    <line x1="440" y1="137" x2="496" y2="137" marker-end="url(#arr)"/>
    <line x1="690" y1="128" x2="746" y2="128" marker-end="url(#arrAmber)"/>
    <line x1="960" y1="128" x2="1016" y2="128" marker-end="url(#arr)"/>
  </g>
  <g fill="#a29372" font-size="11">
    <text x="196" y="126">1 swap</text>
    <text x="446" y="126">2 unlock</text>
    <text x="694" y="117" fill="#ffb300">3 beforeSwap</text>
    <text x="962" y="117">4 latestRoundData</text>
  </g>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#a29372"/></marker>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ffb300"/></marker>
  </defs>

  <!-- decision box -->
  <rect x="500" y="210" width="700" height="196" fill="#141109" stroke="#2e2716"/>
  <text x="524" y="240" fill="#f5ecd7" font-size="14" font-weight="bold">THE DECISION (deterministic code — never a prompt, never an app)</text>
  <g font-size="12.5">
    <text x="524" y="272" fill="#a29372">pool price vs fair price → adverse deviation (direction-aware)</text>
    <rect x="524" y="288" width="200" height="44" fill="#0a0906" stroke="#4ade80"/>
    <text x="624" y="307" fill="#4ade80" text-anchor="middle" font-weight="bold">OK ≤ band/2</text>
    <text x="624" y="324" fill="#a29372" text-anchor="middle" font-size="11">fee 0.05%</text>
    <rect x="740" y="288" width="200" height="44" fill="#0a0906" stroke="#ffb300"/>
    <text x="840" y="307" fill="#ffb300" text-anchor="middle" font-weight="bold">WARN ≤ band</text>
    <text x="840" y="324" fill="#a29372" text-anchor="middle" font-size="11">fee scales up to 1%</text>
    <rect x="956" y="288" width="220" height="44" fill="#0a0906" stroke="#ff4d2e" stroke-width="2"/>
    <text x="1066" y="307" fill="#ff4d2e" text-anchor="middle" font-weight="bold">BLOCK &gt; band → REVERT</text>
    <text x="1066" y="324" fill="#a29372" text-anchor="middle" font-size="11">swap cannot execute</text>
    <text x="524" y="362" fill="#ff4d2e">stale feed · paused oracle · invalid price → REVERT (fail closed, always)</text>
    <text x="524" y="386" fill="#a29372">default band ±3.00% · $WIF stakers tighten it (registry read in the same call)</text>
  </g>
  <line x1="855" y1="164" x2="855" y2="206" stroke="#ffb300" stroke-width="1.5" marker-end="url(#arrAmber)"/>

  <!-- bottom row: flywheel + ledger -->
  <rect x="40" y="440" width="560" height="170" fill="#141109" stroke="#2e2716"/>
  <text x="64" y="472" fill="#ffb300" font-size="14" font-weight="bold">$WIF FLYWHEEL</text>
  <g fill="#f5ecd7" font-size="12.5">
    <text x="64" y="500">1 · Trade guarded → protection you can feel (a blocked rip)</text>
    <text x="64" y="526">2 · Want it tighter? Stake ≥1,000 $WIF → band down to ±0.25%</text>
    <text x="64" y="552">3 · $WIF locked while protection is active; unstake = default</text>
    <text x="64" y="578">4 · Traders return for every stock buy → stake demand recurs</text>
  </g>
  <rect x="640" y="440" width="560" height="170" fill="#141109" stroke="#2e2716"/>
  <text x="664" y="472" fill="#ffb300" font-size="14" font-weight="bold">OVERPAY LEDGER + RUST API</text>
  <g fill="#f5ecd7" font-size="12.5">
    <text x="664" y="500">· Every fill AND every block recorded with the math</text>
    <text x="664" y="526">· “You overpay off-hours” autopsy → tighten the band</text>
    <text x="664" y="552">· Axum service re-reads Chainlink independently (/board)</text>
    <text x="664" y="578">· Saved-$ receipts are the shareable proof (Blockscout-linked)</text>
  </g>
</svg>
